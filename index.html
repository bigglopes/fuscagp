const GEAR_MAX = [15.5, 27.5, 39.5, 52.0];

function createSimulation(initialTrack) {
  let track = initialTrack;
  const cars = new Array(NUM_CARS);
  for (let i = 0; i < NUM_CARS; i++) {
    cars[i] = {
      id: i,
      isPlayer: i === 0,
      x: 0, y: 0, z: 0,
      vx: 0, vz: 0,
      yaw: 0,
      yawRate: 0,
      speed: 0,
      latSpeed: 0,
      steerAngle: 0,
      wheelSpin: 0,
      roll: 0,
      pitch: 0,
      brakeGlow: 0,
      skidAmt: 0,
      rpm: 1100,
      gear: 1,
      throttle: 0,
      station: 0,
      stationFrac: 0,
      latDist: 0,
      surface: 0,
      lap: 1,
      nextCp: 0,
      cpCount: -1,
      totalProgress: 0,
      finished: false,
      finishTime: 0,
      rank: i + 1,
      nx: 0, ny: 1, nz: 0,
      aiTargetLat: 0,
      aiPassTimer: 0,
      dustTimer: 0
    };
  }

  const particles = {
    max: MAX_PARTICLES,
    cursor: 0,
    px: new Float32Array(MAX_PARTICLES),
    py: new Float32Array(MAX_PARTICLES),
    pz: new Float32Array(MAX_PARTICLES),
    vx: new Float32Array(MAX_PARTICLES),
    vy: new Float32Array(MAX_PARTICLES),
    vz: new Float32Array(MAX_PARTICLES),
    age: new Float32Array(MAX_PARTICLES),
    life: new Float32Array(MAX_PARTICLES),
    s0: new Float32Array(MAX_PARTICLES),
    s1: new Float32Array(MAX_PARTICLES),
    cr: new Float32Array(MAX_PARTICLES),
    cg: new Float32Array(MAX_PARTICLES),
    cb: new Float32Array(MAX_PARTICLES),
    a0: new Float32Array(MAX_PARTICLES)
  };

  let pSeed = 918273;
  function pRand() {
    pSeed = (Math.imul(pSeed, 1664525) + 1013904223) >>> 0;
    return pSeed / 4294967296;
  }

  function clearParticles() {
    particles.life.fill(0);
    particles.age.fill(0);
    particles.cursor = 0;
  }

  function spawnParticle(x, y, z, vx, vy, vz, life, s0, s1, r, g, b, a0) {
    const idx = particles.cursor;
    particles.cursor = (idx + 1) % MAX_PARTICLES;
    particles.px[idx] = x; particles.py[idx] = y; particles.pz[idx] = z;
    particles.vx[idx] = vx; particles.vy[idx] = vy; particles.vz[idx] = vz;
    particles.age[idx] = 0; particles.life[idx] = life;
    particles.s0[idx] = s0; particles.s1[idx] = s1;
    particles.cr[idx] = r; particles.cg[idx] = g; particles.cb[idx] = b;
    particles.a0[idx] = a0;
  }

  function stepParticles(dt) {
    const drag = Math.exp(-2.8 * dt);
    for (let i = 0; i < MAX_PARTICLES; i++) {
      const lf = particles.life[i];
      if (lf <= 0) continue;
      particles.age[i] += dt;
      if (particles.age[i] >= lf) { particles.life[i] = 0; continue; }
      particles.px[i] += particles.vx[i] * dt;
      particles.py[i] += particles.vy[i] * dt;
      particles.pz[i] += particles.vz[i] * dt;
      particles.vx[i] *= drag;
      particles.vz[i] *= drag;
      particles.vy[i] += 0.55 * dt;
    }
  }

  const state = {
    phase: -1,
    countdown: 2.8,
    raceTime: 0,
    menuTime: 0,
    selectedCar: 0,
    selectedTrack: 0,
    carColorIdx: new Int32Array([0, 1, 2, 3]),
    lightState: 3,
    autopilot: false,
    order: new Int32Array([0, 1, 2, 3]),
    winnerIdx: -1,
    bumpStrength: 0,
    camX: 0, camY: 4, camZ: -10,
    camTx: 0, camTy: 1, camTz: 0,
    camFov: 60 * Math.PI / 180
  };

  const input = { left: false, right: false, accel: false, brake: false };

  function sampleTrack(sFloat, outObj) {
    const N = track.N;
    let s = sFloat % N;
    if (s < 0) s += N;
    const i0 = Math.floor(s);
    const i1 = (i0 + 1) % N;
    const f = s - i0;
    outObj.px = track.posX[i0] + (track.posX[i1] - track.posX[i0]) * f;
    outObj.py = track.posY[i0] + (track.posY[i1] - track.posY[i0]) * f;
    outObj.pz = track.posZ[i0] + (track.posZ[i1] - track.posZ[i0]) * f;
    outObj.tx = track.tanX[i0] + (track.tanX[i1] - track.tanX[i0]) * f;
    outObj.ty = track.tanY[i0] + (track.tanY[i1] - track.tanY[i0]) * f;
    outObj.tz = track.tanZ[i0] + (track.tanZ[i1] - track.tanZ[i0]) * f;
    outObj.lx = track.leftX[i0] + (track.leftX[i1] - track.leftX[i0]) * f;
    outObj.ly = track.leftY[i0] + (track.leftY[i1] - track.leftY[i0]) * f;
    outObj.lz = track.leftZ[i0] + (track.leftZ[i1] - track.leftZ[i0]) * f;
    outObj.nx = track.normX[i0] + (track.normX[i1] - track.normX[i0]) * f;
    outObj.ny = track.normY[i0] + (track.normY[i1] - track.normY[i0]) * f;
    outObj.nz = track.normZ[i0] + (track.normZ[i1] - track.normZ[i0]) * f;
  }

  const _tr = { px: 0, py: 0, pz: 0, tx: 0, ty: 0, tz: 1, lx: 1, ly: 0, lz: 0, nx: 0, ny: 1, nz: 0 };

  function updateCarTrackProjection(c) {
    const N = track.N;
    let bestI = c.station;
    let bestD2 = 1e12;
    for (let k = -10; k <= 14; k++) {
      const idx = (c.station + k + N) % N;
      const dx = c.x - track.posX[idx];
      const dz = c.z - track.posZ[idx];
      const d2 = dx * dx + dz * dz;
      if (d2 < bestD2) { bestD2 = d2; bestI = idx; }
    }
    const dx = c.x - track.posX[bestI];
    const dz = c.z - track.posZ[bestI];
    const along = dx * track.tanX[bestI] + dz * track.tanZ[bestI];
    const frac = clamp(along / track.stepLen, -0.5, 0.5);
    const sCont = (bestI + frac + N) % N;
    c.station = bestI;
    c.stationFrac = sCont;
    sampleTrack(sCont, _tr);
    const rx = c.x - _tr.px;
    const rz = c.z - _tr.pz;
    c.latDist = rx * _tr.lx + rz * _tr.lz;
    c.y = _tr.py + _tr.ly * c.latDist;
    c.nx = lerp(c.nx, _tr.nx, 0.25);
    c.ny = lerp(c.ny, _tr.ny, 0.25);
    c.nz = lerp(c.nz, _tr.nz, 0.25);
    const absLat = Math.abs(c.latDist);
    if (absLat <= track.halfW) {
      c.surface = 0;
    } else if (absLat <= track.halfW + 1.5) {
      const hasKerb = c.latDist > 0 ? track.kerbL[bestI] > 0.35 : track.kerbR[bestI] > 0.35;
      c.surface = hasKerb ? 1 : 2;
    } else {
      const hasGravel = c.latDist > 0 ? track.gravelL[bestI] > 0.5 : track.gravelR[bestI] > 0.5;
      c.surface = hasGravel ? 3 : 2;
    }
  }

  function setPlayerColor(idx) {
    const pick = ((idx % NUM_CARS) + NUM_CARS) % NUM_CARS;
    state.selectedCar = pick;
    state.carColorIdx[0] = pick;
    let slot = 1;
    for (let k = 0; k < NUM_CARS; k++) {
      if (k !== pick) state.carColorIdx[slot++] = k;
    }
  }

  function snapMenuCamera() {
    const p = cars[0];
    const fx = Math.sin(p.yaw), fz = Math.cos(p.yaw);
    const lx = fz, lz = -fx;
    const a = 0.56 + Math.sin(state.menuTime * 0.28) * 0.24;
    const dist = 5.60;
    state.camX = p.x + fx * Math.cos(a) * dist + lx * Math.sin(a) * dist;
    state.camY = p.y + 1.48 + Math.sin(state.menuTime * 0.35) * 0.12;
    state.camZ = p.z + fz * Math.cos(a) * dist + lz * Math.sin(a) * dist;
    state.camTx = p.x - lx * 1.68 - fx * 0.25;
    state.camTy = p.y + 0.88;
    state.camTz = p.z - lz * 1.68 - fz * 0.25;
    state.camFov = 46 * Math.PI / 180;
  }

  function enterMenu() {
    resetRace(false);
    state.phase = -1;
    state.menuTime = 0;
    state.lightState = 3;
    snapMenuCamera();
  }

  function resetRace(skipCountdown = false) {
    clearParticles();
    state.phase = skipCountdown ? 1 : 0;
    state.countdown = skipCountdown ? 0 : 2.8;
    state.raceTime = 0;
    state.lightState = skipCountdown ? 6 : 0;
    state.winnerIdx = -1;
    state.bumpStrength = 0;
    const N = track.N;
    for (let i = 0; i < NUM_CARS; i++) {
      const c = cars[i];
      const sp = CAR_SPECS[i];
      const sStart = (N - sp.gridBack / track.stepLen) % N;
      sampleTrack(sStart, _tr);
      c.x = _tr.px + _tr.lx * sp.gridLat;
      c.y = _tr.py + _tr.ly * sp.gridLat;
      c.z = _tr.pz + _tr.lz * sp.gridLat;
      c.vx = 0; c.vz = 0;
      c.yaw = Math.atan2(_tr.tx, _tr.tz);
      c.yawRate = 0;
      c.speed = 0;
      c.latSpeed = 0;
      c.steerAngle = 0;
      c.wheelSpin = 0;
      c.roll = 0;
      c.pitch = 0;
      c.brakeGlow = 0;
      c.skidAmt = 0;
      c.rpm = 1150;
      c.gear = 1;
      c.throttle = 0;
      c.station = Math.floor(sStart);
      c.stationFrac = sStart;
      c.latDist = sp.gridLat;
      c.surface = 0;
      c.lap = 1;
      c.nextCp = 0;
      c.cpCount = -1;
      c.totalProgress = -sp.gridBack / track.totalLen;
      c.finished = false;
      c.finishTime = 0;
      c.rank = i + 1;
      c.nx = _tr.nx; c.ny = _tr.ny; c.nz = _tr.nz;
      c.aiTargetLat = sp.prefOffset;
      c.aiPassTimer = 0;
      state.order[i] = i;
    }
    const p = cars[0];
    const fx = Math.sin(p.yaw), fz = Math.cos(p.yaw);
    state.camX = p.x - fx * 6.4;
    state.camY = p.y + 2.45;
    state.camZ = p.z - fz * 6.4;
    state.camTx = p.x + fx * 6.0;
    state.camTy = p.y + 1.15;
    state.camTz = p.z + fz * 6.0;
  }

  const _aiOut = { steer: 0, throttle: 0, brake: 0 };

  function computeAI(c, dt) {
    const N = track.N;
    const sp = CAR_SPECS[state.carColorIdx[c.id]];
    const slotSpec = CAR_SPECS[c.id];
    let maxCurv = 0, nearCurv = 0, apexCurv = 0;
    const scanMax = Math.floor(clamp(16 + c.speed * 0.95, 16, 56));
    for (let k = 2; k <= scanMax; k += 2) {
      const idx = (c.station + k) % N;
      const cv = track.curv[idx];
      const ac = Math.abs(cv);
      if (ac > maxCurv) maxCurv = ac;
      if (k <= 14 && ac > nearCurv) nearCurv = ac;
      if (k <= 18 && ac > Math.abs(apexCurv)) apexCurv = cv;
    }
    const lookAhead = clamp((5.5 + c.speed * 0.27) / (1.0 + nearCurv * 68.0), 4.8, 17.5);
    const sAim = (c.stationFrac + lookAhead) % N;
    let desiredLat = clamp(apexCurv * 185, -track.halfW * 0.50, track.halfW * 0.50);
    if (Math.abs(apexCurv) < 0.008) desiredLat = slotSpec.prefOffset;
    let avoidOffset = 0;
    let blockedFactor = 1.0;
    for (let j = 0; j < NUM_CARS; j++) {
      if (j === c.id) continue;
      const o = cars[j];
      let ds = o.stationFrac - c.stationFrac;
      if (ds < -N * 0.5) ds += N;
      if (ds > N * 0.5) ds -= N;
      const distMeters = ds * track.stepLen;
      if (distMeters > -4.5 && distMeters < 20.0) {
        const dLat = o.latDist - c.latDist;
        if (Math.abs(dLat) < 3.9) {
          const passDir = (o.latDist > 0) ? -1 : 1;
          const urgency = clamp(1.0 - Math.max(0, distMeters) / 20.0, 0.30, 1.0);
          avoidOffset += passDir * 3.8 * urgency;
          if (distMeters > 0.5 && distMeters < 6.2 && Math.abs(dLat) < 2.15) {
            blockedFactor = Math.min(blockedFactor, clamp((distMeters - 3.6) / 2.6, 0.72, 1.0));
          }
        }
      }
    }
    desiredLat = clamp(desiredLat + avoidOffset, -track.halfW * 0.58, track.halfW * 0.58);
    if (Math.abs(c.latDist) > track.halfW * 0.68) {
      desiredLat = -Math.sign(c.latDist) * track.halfW * 0.15;
    }
    c.aiTargetLat = lerp(c.aiTargetLat, desiredLat, clamp(dt * 4.5, 0, 1));
    sampleTrack(sAim, _tr);
    const tx = _tr.px + _tr.lx * c.aiTargetLat;
    const tz = _tr.pz + _tr.lz * c.aiTargetLat;
    const desiredYaw = Math.atan2(tx - c.x, tz - c.z);
    const yawErr = wrapAngle(desiredYaw - c.yaw);
    _aiOut.steer = clamp(yawErr * 2.65 - c.yawRate * 0.14, -1, 1);
    const playerProg = cars[0].totalProgress;
    let paceMod = slotSpec.aiSkill;
    if (!c.isPlayer && !c.finished) {
      const gap = c.totalProgress - playerProg;
      if (gap > 0.10) paceMod *= 0.96;
      else if (gap < -0.10) paceMod *= 1.035;
    } else if (c.isPlayer && state.autopilot) {
      paceMod = 1.015;
    }
    if (c.finished) paceMod = 0.65;
    const cornerV = (maxCurv > 0.005) ? Math.sqrt((15.2 * sp.gripBonus) / maxCurv) : (sp.topSpeed + 4.0);
    const targetV = Math.min(sp.topSpeed * paceMod, cornerV * paceMod) * blockedFactor;
    if (c.speed < targetV - 0.8) {
      _aiOut.throttle = 1.0; _aiOut.brake = 0.0;
    } else if (c.speed > targetV + 1.8) {
      _aiOut.throttle = 0.0; _aiOut.brake = clamp((c.speed - targetV) * 0.18, 0.25, 1.0);
    } else {
      _aiOut.throttle = 0.45; _aiOut.brake = 0.0;
    }
    return _aiOut;
  }

  function stepCar(c, dt, steerCmd, throttleCmd, brakeCmd) {
    const fx = Math.sin(c.yaw), fz = Math.cos(c.yaw);
    const lx = fz, lz = -fx;
    let vFwd = c.vx * fx + c.vz * fz;
    let vLat = c.vx * lx + c.vz * lz;
    const sp = CAR_SPECS[state.carColorIdx[c.id]];
    let gripMul = sp.gripBonus, dragMul = 1.0;
    if (c.surface === 1) {
      gripMul *= 0.94; dragMul = 1.04;
    } else if (c.surface === 2) {
      gripMul *= lerp(0.72, 0.94, sp.offroadBonus);
      dragMul = lerp(2.4, 1.18, sp.offroadBonus);
    } else if (c.surface === 3) {
      gripMul *= lerp(0.58, 0.88, sp.offroadBonus);
      dragMul = lerp(3.8, 1.38, sp.offroadBonus);
    }
    if (state.phase === 0) {
      c.throttle = throttleCmd;
      const targetRpm = 1150 + throttleCmd * 4800;
      c.rpm = lerp(c.rpm, targetRpm, clamp(dt * 9, 0, 1));
      c.steerAngle = lerp(c.steerAngle, steerCmd * 0.42, clamp(dt * 10, 0, 1));
      c.brakeGlow = brakeCmd;
      return;
    }
    const maxSteer = lerp(0.56, 0.22, clamp(Math.abs(vFwd) / 48.0, 0, 1));
    const targetSteer = steerCmd * maxSteer;
    c.steerAngle = lerp(c.steerAngle, targetSteer, clamp(dt * 12.5, 0, 1));
    let accel = 0;
    c.throttle = throttleCmd;
    c.brakeGlow = 0;
    if (throttleCmd > 0.01) {
      const spdFrac = clamp(Math.max(0, vFwd) / sp.topSpeed, 0, 1.02);
      const engineForce = (17.2 * sp.accelMul * (1.0 - 0.64 * spdFrac * spdFrac) + 2.8 * sp.accelMul) * throttleCmd;
      accel += engineForce;
    }
    if (brakeCmd > 0.01) {
      c.brakeGlow = brakeCmd;
      if (vFwd > 0.8) accel -= 26.5 * sp.brakeMul * brakeCmd * gripMul;
      else accel -= 10.5 * brakeCmd;
    }
    const rollDrag = 0.45 * dragMul * Math.sign(vFwd);
    const aeroDrag = 0.0042 * (50.8 / sp.topSpeed) * (50.8 / sp.topSpeed) * vFwd * Math.abs(vFwd) * dragMul;
    vFwd += (accel - rollDrag - aeroDrag) * dt;
    vFwd = clamp(vFwd, -14.0, sp.topSpeed + 1.5);
    const absSpd = Math.abs(vFwd);
    const dirSign = vFwd >= -0.05 ? 1 : -1;
    const speedFactor = clamp(absSpd / 6.0, 0, 1);
    const rwdBoost = 1.0 + throttleCmd * 0.14 * clamp(absSpd / 28.0, 0, 1);
    const targetYawRate = c.steerAngle * 3.15 * speedFactor * dirSign * gripMul * rwdBoost * (1.0 / (1.0 + absSpd * 0.019));
    c.yawRate = lerp(c.yawRate, targetYawRate, clamp(dt * 10.5, 0, 1));
    c.yaw = wrapAngle(c.yaw + c.yawRate * dt);
    const latGrip = (8.8 - throttleCmd * 1.4) * gripMul;
    vLat -= c.yawRate * vFwd * 0.16 * dt;
    vLat *= Math.exp(-latGrip * dt);
    vFwd *= Math.exp(-Math.abs(vLat) * 0.015 * dt);
    const nfx = Math.sin(c.yaw), nfz = Math.cos(c.yaw);
    const nlx = nfz, nlz = -nfx;
    c.vx = nfx * vFwd + nlx * vLat;
    c.vz = nfz * vFwd + nlz * vLat;
    c.x += c.vx * dt;
    c.z += c.vz * dt;
    c.speed = vFwd;
    c.latSpeed = vLat;
    c.wheelSpin += (vFwd / sp.wheelRadius) * dt;
    const latG = clamp((c.yawRate * vFwd) / 14.0, -1.4, 1.4);
    const kerbVib = (c.surface === 1 && absSpd > 6) ? Math.sin(state.raceTime * 48) * 0.018 : 0;
    const targetRoll = clamp(latG * 0.078 * sp.rollMul, -0.125, 0.125) + kerbVib;
    const targetPitch = clamp(-accel * 0.0022 * sp.pitchMul, -0.055, 0.055);
    c.roll = lerp(c.roll, targetRoll, clamp(dt * 9.0, 0, 1));
    c.pitch = lerp(c.pitch, targetPitch, clamp(dt * 8.5, 0, 1));
    const slip = Math.abs(vLat) * 0.14 + Math.max(0, Math.abs(latG) - 0.68) * 0.9 + (brakeCmd > 0.6 && absSpd > 16 ? 0.35 : 0);
    c.skidAmt = lerp(c.skidAmt, clamp(slip, 0, 1), clamp(dt * 10, 0, 1));
    const isLaunch = (state.phase === 1 && state.raceTime < 2.2 && throttleCmd > 0.65 && vFwd > 0.3 && vFwd < 10.0);
    const isHumanBrake = (c.isPlayer && !state.autopilot && brakeCmd > 0.45 && absSpd > 8.5);
    const isTurnBrake = (!c.finished && brakeCmd > 0.72 && Math.abs(c.steerAngle) > 0.14 && absSpd > 14.0);
    const isDrift = (!c.finished && Math.abs(vLat) > 2.8 && Math.abs(c.steerAngle) > 0.22 && absSpd > 14.0);
    const isOffTrack = (c.surface >= 2 && absSpd > 4.0);
    if (isLaunch || isHumanBrake || isTurnBrake || isDrift || isOffTrack) {
      const stepDist = isOffTrack ? 0.34 : 0.38;
      c.dustTimer += Math.max(absSpd, 5.0) * dt;
      let s0 = 0.40, s1 = 1.15, life = 0.24, a0 = 0.24, inherit = 0.32;
      let pr = 0.96, pg = 0.94, pb = 0.88;
      if (isOffTrack) {
        s0 = 0.46; s1 = 1.35; life = 0.32; a0 = 0.42; inherit = 0.26;
        if (c.surface === 3) { pr = 0.86; pg = 0.70; pb = 0.44; }
        else { pr = 0.60; pg = 0.56; pb = 0.34; }
      } else if (isLaunch) {
        s0 = 0.42; s1 = 1.25; life = 0.28; a0 = 0.32; inherit = 0.22;
        pr = 0.96; pg = 0.93; pb = 0.86;
      } else {
        s0 = 0.38; s1 = 1.10; life = 0.22; a0 = 0.22; inherit = 0.34;
        pr = 0.96; pg = 0.97; pb = 1.00;
      }
      let sub = 0;
      while (c.dustTimer >= stepDist && sub < 2) {
        c.dustTimer -= stepDist;
        const backOff = sp.rearWheelZ + sub * 0.22;
        sub++;
        for (let wi = 0; wi < 2; wi++) {
          const side = wi === 0 ? 1 : -1;
          const jitterL = (pRand() - 0.5) * 0.26;
          const wx = c.x - nfx * backOff + nlx * (side * sp.rearWheelX + jitterL);
          const wy = c.y + 0.14 + pRand() * 0.12;
          const wz = c.z - nfz * backOff + nlz * (side * sp.rearWheelX + jitterL);
          const backSpd = isLaunch ? 1.6 : 0.45;
          const pvx = c.vx * inherit - nfx * backSpd + nlx * (side * (0.28 + pRand() * 0.55)) + (pRand() - 0.5) * 0.85;
          const pvy = 0.42 + pRand() * 0.45;
          const pvz = c.vz * inherit - nfz * backSpd + nlz * (side * (0.28 + pRand() * 0.55)) + (pRand() - 0.5) * 0.85;
          spawnParticle(wx, wy, wz, pvx, pvy, pvz, life * (0.82 + pRand() * 0.36), s0 * (0.84 + pRand() * 0.32), s1 * (0.84 + pRand() * 0.32), pr, pg, pb, a0);
        }
      }
    } else {
      c.dustTimer = 0;
    }
    let gear = 1;
    const spdK = Math.abs(vFwd);
    for (let g = 0; g < 4; g++) {
      if (spdK <= GEAR_MAX[g] || g === 3) { gear = g + 1; break; }
    }
    c.gear = vFwd < -0.5 ? 0 : gear;
    const gMin = gear === 1 ? 0 : GEAR_MAX[gear - 2] * 0.72;
    const gMax = GEAR_MAX[gear - 1];
    const gFrac = clamp((spdK - gMin) / (gMax - gMin), 0, 1.06);
    const targetRpm = 1100 + gFrac * 5500 + throttleCmd * 320;
    c.rpm = lerp(c.rpm, clamp(targetRpm, 950, 6900), clamp(dt * 11, 0, 1));
    updateCarTrackProjection(c);
    const maxLat = track.railDist - 0.95;
    if (Math.abs(c.latDist) > maxLat) {
      const sign = c.latDist > 0 ? 1 : -1;
      const pen = Math.abs(c.latDist) - maxLat;
      sampleTrack(c.stationFrac, _tr);
      c.x -= _tr.lx * sign * pen;
      c.z -= _tr.lz * sign * pen;
      c.latDist = sign * maxLat;
      const vn = c.vx * _tr.lx * sign + c.vz * _tr.lz * sign;
      if (vn > 0) {
        c.vx -= _tr.lx * sign * vn * 1.25;
        c.vz -= _tr.lz * sign * vn * 1.25;
        c.vx *= 0.88;
        c.vz *= 0.88;
        if (c.isPlayer && vn > 2.5) state.bumpStrength = Math.max(state.bumpStrength, clamp(vn / 14, 0.2, 1.0));
      }
    }
    const cpIdx = Math.floor((c.stationFrac / track.N) * NUM_CHECKPOINTS) % NUM_CHECKPOINTS;
    if (cpIdx === c.nextCp) {
      c.cpCount++;
      c.nextCp = (c.nextCp + 1) % NUM_CHECKPOINTS;
      if (cpIdx === 0 && c.cpCount >= NUM_CHECKPOINTS) {
        const completedLaps = Math.floor(c.cpCount / NUM_CHECKPOINTS);
        if (!c.finished) {
          if (completedLaps >= TOTAL_LAPS) {
            c.finished = true;
            c.finishTime = state.raceTime;
            if (state.winnerIdx < 0) state.winnerIdx = c.id;
            if (c.isPlayer) state.phase = 2;
          } else {
            c.lap = completedLaps + 1;
          }
        }
      }
    }
    let lapFrac = c.stationFrac / track.N;
    if (c.cpCount < 0 && lapFrac > 0.75) lapFrac -= 1.0;
    else if (c.nextCp === 0 && lapFrac < 0.25) lapFrac += 1.0;
    const baseLaps = c.cpCount < 0 ? 0 : Math.floor(c.cpCount / NUM_CHECKPOINTS);
    const doneLaps = c.finished ? TOTAL_LAPS + 0.1 + (1000 - c.finishTime) * 0.001 : baseLaps + lapFrac;
    c.totalProgress = doneLaps;
  }

  function resolveCarCollisions() {
    const CAP_OFF = 1.25;
    const MIN_D = 2.18;
    const MIN_D2 = MIN_D * MIN_D;
    for (let iter = 0; iter < 2; iter++) {
      for (let i = 0; i < NUM_CARS; i++) {
        const a = cars[i];
        const afx = Math.sin(a.yaw) * CAP_OFF, afz = Math.cos(a.yaw) * CAP_OFF;
        for (let j = i + 1; j < NUM_CARS; j++) {
          const b = cars[j];
          const cdx = b.x - a.x, cdz = b.z - a.z;
          if (cdx * cdx + cdz * cdz > 25.0) continue;
          const bfx = Math.sin(b.yaw) * CAP_OFF, bfz = Math.cos(b.yaw) * CAP_OFF;
          for (let sa = -1; sa <= 1; sa += 2) {
            const ax = a.x + afx * sa, az = a.z + afz * sa;
            for (let sb = -1; sb <= 1; sb += 2) {
              const bx = b.x + bfx * sb, bz = b.z + bfz * sb;
              const dx = bx - ax, dz = bz - az;
              const d2 = dx * dx + dz * dz;
              if (d2 < MIN_D2 && d2 > 1e-6) {
                const d = Math.sqrt(d2);
                const nx = dx / d, nz = dz / d;
                const pen = (MIN_D - d) * 0.54;
                a.x -= nx * pen; a.z -= nz * pen;
                b.x += nx * pen; b.z += nz * pen;
                const rvx = b.vx - a.vx, rvz = b.vz - a.vz;
                const vn = rvx * nx + rvz * nz;
                if (vn < 0) {
                  const imp = -vn * 0.68;
                  a.vx -= nx * imp; a.vz -= nz * imp;
                  b.vx += nx * imp; b.vz += nz * imp;
                  if ((a.isPlayer || b.isPlayer) && -vn > 1.8) {
                    state.bumpStrength = Math.max(state.bumpStrength, clamp(-vn / 12, 0.25, 1.0));
                  }
                }
              }
            }
          }
        }
      }
    }
  }

  function updateRankings() {
    const ord = state.order;
    for (let i = 1; i < NUM_CARS; i++) {
      const key = ord[i];
      const keyP = cars[key].totalProgress;
      let j = i - 1;
      while (j >= 0 && cars[ord[j]].totalProgress < keyP) {
        ord[j + 1] = ord[j];
        j--;
      }
      ord[j + 1] = key;
    }
    for (let r = 0; r < NUM_CARS; r++) {
      cars[ord[r]].rank = r + 1;
    }
  }

  function updateCamera(dt) {
    const p = cars[0];
    const fx = Math.sin(p.yaw), fz = Math.cos(p.yaw);
    if (state.phase === -1) {
      const lx = fz, lz = -fx;
      const a = 0.56 + Math.sin(state.menuTime * 0.28) * 0.24;
      const dist = 5.60;
      const targetX = p.x + fx * Math.cos(a) * dist + lx * Math.sin(a) * dist;
      const targetY = p.y + 1.48 + Math.sin(state.menuTime * 0.35) * 0.12;
      const targetZ = p.z + fz * Math.cos(a) * dist + lz * Math.sin(a) * dist;
      const aimX = p.x - lx * 1.68 - fx * 0.25;
      const aimY = p.y + 0.88;
      const aimZ = p.z - lz * 1.68 - fz * 0.25;
      const k = 1.0 - Math.exp(-6.0 * dt);
      state.camX += (targetX - state.camX) * k;
      state.camY += (targetY - state.camY) * k;
      state.camZ += (targetZ - state.camZ) * k;
      state.camTx += (aimX - state.camTx) * k;
      state.camTy += (aimY - state.camTy) * k;
      state.camTz += (aimZ - state.camTz) * k;
      state.camFov = lerp(state.camFov, 46 * Math.PI / 180, k);
      return;
    }
    if (state.phase === 2) {
      const ang = state.raceTime * 0.55;
      const dist = 6.2;
      const tx = p.x + Math.sin(ang) * dist;
      const tz = p.z + Math.cos(ang) * dist;
      state.camX = lerp(state.camX, tx, clamp(dt * 3.5, 0, 1));
      state.camY = lerp(state.camY, p.y + 2.35, clamp(dt * 3.5, 0, 1));
      state.camZ = lerp(state.camZ, tz, clamp(dt * 3.5, 0, 1));
      state.camTx = lerp(state.camTx, p.x, clamp(dt * 6, 0, 1));
      state.camTy = lerp(state.camTy, p.y + 0.85, clamp(dt * 6, 0, 1));
      state.camTz = lerp(state.camTz, p.z, clamp(dt * 6, 0, 1));
      state.camFov = lerp(state.camFov, 54 * Math.PI / 180, clamp(dt * 4, 0, 1));
      return;
    }
    const spdRatio = clamp(Math.abs(p.speed) / 48.0, 0, 1);
    const camDist = 6.05 + spdRatio * 0.65;
    const camH = 2.38 + spdRatio * 0.14;
    const desiredX = p.x - fx * camDist;
    const desiredY = p.y + camH;
    const desiredZ = p.z - fz * camDist;
    const kPos = 1.0 - Math.exp(-9.5 * dt);
    state.camX += (desiredX - state.camX) * kPos;
    state.camY += (desiredY - state.camY) * kPos;
    state.camZ += (desiredZ - state.camZ) * kPos;
    const lookX = p.x + fx * 6.5;
    const lookY = p.y + 1.12;
    const lookZ = p.z + fz * 6.5;
    const kLook = 1.0 - Math.exp(-14.0 * dt);
    state.camTx += (lookX - state.camTx) * kLook;
    state.camTy += (lookY - state.camTy) * kLook;
    state.camTz += (lookZ - state.camTz) * kLook;
    const targetFov = (58 + spdRatio * 10) * Math.PI / 180;
    state.camFov = lerp(state.camFov, targetFov, clamp(dt * 6, 0, 1));
  }

  function step(dt) {
    state.bumpStrength = 0;
    if (state.phase === -1) {
      state.menuTime += dt;
      cars[0].rpm = 1150 + Math.sin(state.menuTime * 3.0) * 60;
      cars[0].steerAngle = Math.sin(state.menuTime * 0.4) * 0.18;
      updateCamera(dt);
      return;
    }
    if (state.phase === 0) {
      state.countdown -= dt;
      if (state.countdown > 2.2) state.lightState = 1;
      else if (state.countdown > 1.7) state.lightState = 2;
      else if (state.countdown > 1.2) state.lightState = 3;
      else if (state.countdown > 0.7) state.lightState = 4;
      else if (state.countdown > 0.0) state.lightState = 5;
      else {
        state.phase = 1;
        state.lightState = 6;
      }
    } else if (state.phase === 1) {
      state.raceTime += dt;
      if (state.raceTime > 3.5) state.lightState = 0;
    } else if (state.phase === 2) {
      state.raceTime += dt;
      state.lightState = 0;
    }
    for (let i = 0; i < NUM_CARS; i++) {
      const c = cars[i];
      let steer = 0, throttle = 0, brake = 0;
      if (c.isPlayer && !state.autopilot && !c.finished) {
        steer = (input.left ? 1 : 0) - (input.right ? 1 : 0);
        throttle = input.accel ? 1 : 0;
        brake = input.brake ? 1 : 0;
      } else {
        const ai = computeAI(c, dt);
        steer = ai.steer;
        throttle = ai.throttle;
        brake = ai.brake;
      }
      stepCar(c, dt, steer, throttle, brake);
    }
    if (state.phase >= 1) {
      resolveCarCollisions();
      updateRankings();
    }
    stepParticles(dt);
    updateCamera(dt);
  }

  function setTrack(newTrack, trackIdx) {
    track = newTrack;
    state.selectedTrack = trackIdx;
    if (state.phase === -1) enterMenu();
    else resetRace(false);
  }

  enterMenu();
  return { cars, state, input, particles, step, resetRace, enterMenu, setPlayerColor, setTrack, sampleTrack };
}

const MAX_HUD_QUADS = 640;
const CAR_DRAW_SLOTS = 24;
const CAR_STRIDE_F32 = 64;
const MAX_TELEM = 65536;
const FIXED_DT = 1 / 180;
const SHADOW_SIZE = 2048;

async function start() {
  const canvas = document.getElementById('c');
  const errEl = document.getElementById('err');
  const menuEl = document.getElementById('menu');
  if (!navigator.gpu) {
    if (menuEl) menuEl.style.display = 'none';
    errEl.style.display = 'flex';
    errEl.textContent = 'WebGPU não suportado neste navegador. Use Chrome 113+ com aceleração por GPU.';
    return;
  }
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) {
    if (menuEl) menuEl.style.display = 'none';
    errEl.style.display = 'flex';
    errEl.textContent = 'Nenhum adaptador WebGPU encontrado.';
    return;
  }
  const hasTimestamp = adapter.features.has('timestamp-query');
  const device = await adapter.requestDevice({
    requiredFeatures: hasTimestamp ? ['timestamp-query'] : []
  });
  device.addEventListener('uncapturederror', e => console.error('GPU_ERR:', e.error.message));
  const context = canvas.getContext('webgpu');
  const format = navigator.gpu.getPreferredCanvasFormat();
  let width = 0, height = 0;
  let bloomW = 640, bloomH = 360;
  let hdrMsaaTex = null, hdrMsaaView = null;
  let hdrResolveTex = null, hdrResolveView = null;
  let gbufMsaaTex = null, gbufMsaaView = null;
  let gbufResolveTex = null, gbufResolveView = null;
  let depthTex = null, depthView = null;
  let bloomATex = null, bloomAView = null;
  let bloomBTex = null, bloomBView = null;
  let bloomPreBG = null, bloomBlurHBG = null, bloomBlurVBG = null, compositeBG = null;

  const linSamp = device.createSampler({
    addressModeU: 'clamp-to-edge', addressModeV: 'clamp-to-edge',
    magFilter: 'linear', minFilter: 'linear'
  });
  const shadowTex = device.createTexture({
    size: [SHADOW_SIZE, SHADOW_SIZE, 1],
    format: 'depth32float',
    usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING
  });
  const shadowView = shadowTex.createView();
  const shadowSamp = device.createSampler({
    compare: 'less', magFilter: 'linear', minFilter: 'linear',
    addressModeU: 'clamp-to-edge', addressModeV: 'clamp-to-edge'
  });

  function makeGpuBuf(data, usage) {
    const size = Math.ceil(data.byteLength / 4) * 4;
    const buf = device.createBuffer({ size, usage: usage | GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(buf, 0, data);
    return buf;
  }

  const trackCache = new Array(CIRCUITS.length).fill(null);
  function getTrackBundle(idx) {
    const ci = ((idx % CIRCUITS.length) + CIRCUITS.length) % CIRCUITS.length;
    if (!trackCache[ci]) {
      const td = buildTrackData(ci);
      trackCache[ci] = {
        idx: ci,
        track: td,
        worldVB: makeGpuBuf(td.worldBuffers.vertices, GPUBufferUsage.VERTEX),
        worldIB: makeGpuBuf(td.worldBuffers.indices, GPUBufferUsage.INDEX),
        decalVB: makeGpuBuf(td.decalBuffers.vertices, GPUBufferUsage.VERTEX),
        decalIB: makeGpuBuf(td.decalBuffers.indices, GPUBufferUsage.INDEX)
      };
    }
    return trackCache[ci];
  }

  let activeTrack = getTrackBundle(0);
  let track = activeTrack.track;
  let worldVB = activeTrack.worldVB, worldIB = activeTrack.worldIB;
  let decalVB = activeTrack.decalVB, decalIB = activeTrack.decalIB;

  // Build all 4 distinct procedural vehicle models:
  // 0: VW Fusca, 1: Fiat Uno, 2: Jipe 4x4, 3: Calhambeque Vintage
  const vehicleMeshes = [
    buildFuscaMeshes(),
    buildUnoMeshes(),
    buildJipeMeshes(),
    buildCalhambequeMeshes()
  ];
  const vehicleGpu = vehicleMeshes.map(vm => ({
    bodyVB: makeGpuBuf(vm.body.vertices, GPUBufferUsage.VERTEX),
    bodyIB: makeGpuBuf(vm.body.indices, GPUBufferUsage.INDEX),
    bodyCount: vm.body.indexCount,
    wheelVB: makeGpuBuf(vm.wheel.vertices, GPUBufferUsage.VERTEX),
    wheelIB: makeGpuBuf(vm.wheel.indices, GPUBufferUsage.INDEX),
    wheelCount: vm.wheel.indexCount,
    shadowVB: makeGpuBuf(vm.shadow.vertices, GPUBufferUsage.VERTEX),
    shadowIB: makeGpuBuf(vm.shadow.indices, GPUBufferUsage.INDEX),
    shadowCount: vm.shadow.indexCount,
    wheelOffsets: vm.wheelOffsets
  }));

  const sim = createSimulation(track);
  const audio = createAudioEngine();
  const worldTex = createWorldTextureArray(device);
  const worldSamp = device.createSampler({
    addressModeU: 'repeat', addressModeV: 'repeat',
    magFilter: 'linear', minFilter: 'linear', mipmapFilter: 'linear', maxAnisotropy: 16
  });
  const hudAtlas = createHudAtlas(device);
  const hudSamp = device.createSampler({
    addressModeU: 'clamp-to-edge', addressModeV: 'clamp-to-edge',
    magFilter: 'linear', minFilter: 'linear', mipmapFilter: 'linear'
  });

  const hudVertData = new Float32Array(MAX_HUD_QUADS * 4 * 8);
  const hudIdxData = new Uint16Array(MAX_HUD_QUADS * 6);
  for (let q = 0; q < MAX_HUD_QUADS; q++) {
    const v = q * 4, o = q * 6;
    hudIdxData[o] = v; hudIdxData[o + 1] = v + 1; hudIdxData[o + 2] = v + 2;
    hudIdxData[o + 3] = v; hudIdxData[o + 4] = v + 2; hudIdxData[o + 5] = v + 3;
  }
  const hudVB = device.createBuffer({ size: hudVertData.byteLength, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
  const hudIB = makeGpuBuf(hudIdxData, GPUBufferUsage.INDEX);

  const particleVertData = new Float32Array(MAX_PARTICLES * 4 * 9);
  const particleIdxData = new Uint16Array(MAX_PARTICLES * 6);
  for (let q = 0; q < MAX_PARTICLES; q++) {
    const v = q * 4, o = q * 6;
    particleIdxData[o] = v; particleIdxData[o + 1] = v + 1; particleIdxData[o + 2] = v + 2;
    particleIdxData[o + 3] = v; particleIdxData[o + 4] = v + 2; particleIdxData[o + 5] = v + 3;
  }
  const particleVB = device.createBuffer({ size: particleVertData.byteLength, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
  const particleIB = makeGpuBuf(particleIdxData, GPUBufferUsage.INDEX);

  const sceneUniformData = new Float32Array(64);
  const sceneUniformBuf = device.createBuffer({ size: sceneUniformData.byteLength, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const carUniformData = new Float32Array(CAR_DRAW_SLOTS * CAR_STRIDE_F32);
  const carUniformBuf = device.createBuffer({ size: carUniformData.byteLength, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const blurHData = new Float32Array([1 / 640, 0, 0, 0]);
  const blurVData = new Float32Array([0, 1 / 360, 0, 0]);
  const blurHBuf = makeGpuBuf(blurHData, GPUBufferUsage.UNIFORM);
  const blurVBuf = makeGpuBuf(blurVData, GPUBufferUsage.UNIFORM);

  const sceneOnlyBGL = device.createBindGroupLayout({
    entries: [{ binding: 0, visibility: GPUShaderStage.VERTEX | GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } }]
  });
  const carSceneBGL = device.createBindGroupLayout({
    entries: [
      { binding: 0, visibility: GPUShaderStage.VERTEX | GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } },
      { binding: 3, visibility: GPUShaderStage.FRAGMENT, texture: { sampleType: 'depth' } },
      { binding: 4, visibility: GPUShaderStage.FRAGMENT, sampler: { type: 'comparison' } }
    ]
  });
  const worldBGL = device.createBindGroupLayout({
    entries: [
      { binding: 0, visibility: GPUShaderStage.VERTEX | GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } },

  function writeCarSlot(slot, mat, r, g, b, carIdx, brakeGlow, isWheel, spin) {
    const off = slot * CAR_STRIDE_F32;
    for (let k = 0; k < 16; k++) carUniformData[off + k] = mat[k];
    carUniformData[off + 16] = r; carUniformData[off + 17] = g;
    carUniformData[off + 18] = b; carUniformData[off + 19] = carIdx;
    carUniformData[off + 20] = brakeGlow; carUniformData[off + 21] = isWheel;
    carUniformData[off + 22] = spin; carUniformData[off + 23] = 0;
  }

  function updateCarUniforms() {
    const colMap = sim.state.carColorIdx;
    for (let i = 0; i < NUM_CARS; i++) {
      const c = sim.cars[i];
      const colId = colMap[i];
      const sp = CAR_SPECS[colId];
      const vm = vehicleGpu[colId];
      const rawFx = Math.sin(c.yaw), rawFz = Math.cos(c.yaw);
      const ux = c.nx, uy = c.ny, uz = c.nz;
      const dotFU = rawFx * ux + rawFz * uz;
      let fx = rawFx - ux * dotFU, fy = -uy * dotFU, fz = rawFz - uz * dotFU;
      const fl = Math.hypot(fx, fy, fz) || 1;
      fx /= fl; fy /= fl; fz /= fl;
      let lx = uy * fz - uz * fy, ly = uz * fx - ux * fz, lz = ux * fy - uy * fx;
      const ll = Math.hypot(lx, ly, lz) || 1;
      lx /= ll; ly /= ll; lz /= ll;
      mat4FromBasis(matCarBase, c.x, c.y, c.z, lx, ly, lz, ux, uy, uz, fx, fy, fz);
      mat4RotateX(matPitch, c.pitch);
      mat4RotateZ(matRoll, c.roll);
      mat4Mul(matTmp1, matCarBase, matPitch);
      mat4Mul(matCarBody, matTmp1, matRoll);
      writeCarSlot(i, matCarBody, sp.rgb[0], sp.rgb[1], sp.rgb[2], colId, c.brakeGlow, 0, 0);
      writeCarSlot(20 + i, matCarBase, 0, 0, 0, colId, 0, 0, 0);
      for (let w = 0; w < 4; w++) {
        const wo = vm.wheelOffsets[w];
        mat4Translate(matWOff, wo[0], wo[1], wo[2]);
        mat4Mul(matTmp1, matCarBase, matWOff);
        if (wo[3]) {
          mat4RotateY(matWSteer, c.steerAngle);
          mat4Mul(matTmp2, matTmp1, matWSteer);
        } else {
          for (let k = 0; k < 16; k++) matTmp2[k] = matTmp1[k];
        }
        mat4RotateX(matWSpin, c.wheelSpin);
        mat4Mul(matTmp1, matTmp2, matWSpin);
        if (wo[4]) mat4Mul(matWheel, matTmp1, matWFlip);
        else for (let k = 0; k < 16; k++) matWheel[k] = matTmp1[k];
        writeCarSlot(4 + i * 4 + w, matWheel, sp.rgb[0], sp.rgb[1], sp.rgb[2], colId, 0, 1, c.wheelSpin);
      }
    }
    device.queue.writeBuffer(carUniformBuf, 0, carUniformData);
  }

  let particleQuadCount = 0;
  function updateParticlesBuffer() {
    particleQuadCount = 0;
    const pt = sim.particles;
    const rx = matView[0], ry = matView[4], rz = matView[8];
    const ux = matView[1], uy = matView[5], uz = matView[9];
    const d = particleVertData;
    for (let i = 0; i < MAX_PARTICLES; i++) {
      const lf = pt.life[i];
      if (lf <= 0) continue;
      const t = pt.age[i] / lf;
      if (t >= 1.0) continue;
      const fadeIn = t < 0.12 ? (t / 0.12) : 1.0;
      const fadeOut = 1.0 - t * t;
      const alpha = pt.a0[i] * fadeIn * fadeOut;
      if (alpha < 0.02) continue;
      const growT = t < 0.60 ? (t / 0.60) : (1.0 - (t - 0.60) / 0.40 * 0.55);
      const rad = (pt.s0[i] + (pt.s1[i] - pt.s0[i]) * growT) * 0.5;
      const ang = i * 1.618 + t * 1.35;
      const ca = Math.cos(ang) * rad, sa = Math.sin(ang) * rad;
      const ax = rx * ca + ux * sa, ay = ry * ca + uy * sa, az = rz * ca + uz * sa;
      const bx = -rx * sa + ux * ca, by = -ry * sa + uy * ca, bz = -rz * sa + uz * ca;
      const px = pt.px[i], py = pt.py[i], pz = pt.pz[i];
      const r = pt.cr[i], g = pt.cg[i], b = pt.cb[i];
      let o = particleQuadCount * 36;
      d[o] = px - ax - bx; d[o + 1] = py - ay - by; d[o + 2] = pz - az - bz; d[o + 3] = 0; d[o + 4] = 0; d[o + 5] = r; d[o + 6] = g; d[o + 7] = b; d[o + 8] = alpha; o += 9;
      d[o] = px + ax - bx; d[o + 1] = py + ay - by; d[o + 2] = pz + az - bz; d[o + 3] = 1; d[o + 4] = 0; d[o + 5] = r; d[o + 6] = g; d[o + 7] = b; d[o + 8] = alpha; o += 9;
      d[o] = px + ax + bx; d[o + 1] = py + ay + by; d[o + 2] = pz + az + bz; d[o + 3] = 1; d[o + 4] = 1; d[o + 5] = r; d[o + 6] = g; d[o + 7] = b; d[o + 8] = alpha; o += 9;
      d[o] = px - ax + bx; d[o + 1] = py - ay + by; d[o + 2] = pz - az + bz; d[o + 3] = 0; d[o + 4] = 1; d[o + 5] = r; d[o + 6] = g; d[o + 7] = b; d[o + 8] = alpha;
      particleQuadCount++;
    }
    if (particleQuadCount > 0) {
      device.queue.writeBuffer(particleVB, 0, particleVertData, 0, particleQuadCount * 36);
    }
  }

  function updateLightVP(focusX, focusY, focusZ) {
    const SPAN = 58.0;
    mat4LookAt(matLightView, focusX + SUN_X * 90, focusY + SUN_Y * 90, focusZ + SUN_Z * 90, focusX, focusY, focusZ, 0, 1, 0);
    const texelWorld = (2.0 * SPAN) / SHADOW_SIZE;
    matLightView[12] = Math.round(matLightView[12] / texelWorld) * texelWorld;
    matLightView[13] = Math.round(matLightView[13] / texelWorld) * texelWorld;
    mat4Ortho(matLightProj, -SPAN, SPAN, -SPAN, SPAN, 1.0, 220.0);
    mat4Mul(matLightVP, matLightProj, matLightView);
  }

  function renderFrame(nowMs) {
    const st = sim.state;

    mat4Invert(matInvVP, matVP);
    const p0 = sim.cars[0];
    const shFx = camOverride.active ? tx : (p0.x + Math.sin(p0.yaw) * 14.0);
    const shFy = camOverride.active ? ty : p0.y;
    const shFz = camOverride.active ? tz : (p0.z + Math.cos(p0.yaw) * 14.0);
    updateLightVP(shFx, shFy, shFz);
    for (let k = 0; k < 16; k++) sceneUniformData[k] = matVP[k];
    for (let k = 0; k < 16; k++) sceneUniformData[16 + k] = matInvVP[k];
    for (let k = 0; k < 16; k++) sceneUniformData[32 + k] = matLightVP[k];
    sceneUniformData[48] = ex; sceneUniformData[49] = ey; sceneUniformData[50] = ez; sceneUniformData[51] = 1;
    sceneUniformData[52] = SUN_X; sceneUniformData[53] = SUN_Y; sceneUniformData[54] = SUN_Z; sceneUniformData[55] = track.theme || 0;
    sceneUniformData[56] = 0.72; sceneUniformData[57] = 0.84; sceneUniformData[58] = 0.96; sceneUniformData[59] = 1;
    sceneUniformData[60] = nowMs * 0.001;
    sceneUniformData[61] = st.lightState;
    sceneUniformData[62] = 1.08;
    sceneUniformData[63] = clamp(Math.abs(p0.speed) / 48.0, 0, 1);
    device.queue.writeBuffer(sceneUniformBuf, 0, sceneUniformData);
    updateCarUniforms();
    updateParticlesBuffer();
    buildHUD();
    if (hudQuadCount > 0) {
      device.queue.writeBuffer(hudVB, 0, hudVertData, 0, hudQuadCount * 32);
    }

    const enc = device.createCommandEncoder();
    // Pass 1: Shadow Map
    {
      const sp = enc.beginRenderPass(shadowPassDesc);
      sp.setPipeline(shadowWorldPipe);
      sp.setBindGroup(0, sceneOnlyBG);
      sp.setVertexBuffer(0, worldVB);
      sp.setIndexBuffer(worldIB, 'uint32');
      sp.drawIndexed(track.worldBuffers.indexCount);
      sp.setPipeline(shadowCarPipe);
      sp.setBindGroup(0, sceneOnlyBG);
      for (let i = 0; i < NUM_CARS; i++) {
        const vm = vehicleGpu[colMap[i]];
        sp.setVertexBuffer(0, vm.bodyVB);
        sp.setIndexBuffer(vm.bodyIB, 'uint32');
        sp.setBindGroup(1, carDynBG, [i * 256]);
        sp.drawIndexed(vm.bodyCount);
        sp.setVertexBuffer(0, vm.wheelVB);
        sp.setIndexBuffer(vm.wheelIB, 'uint32');
        for (let w = 0; w < 4; w++) {
          sp.setBindGroup(1, carDynBG, [(4 + i * 4 + w) * 256]);
          sp.drawIndexed(vm.wheelCount);
        }
      }
      sp.end();
    }
    // Pass 2: HDR + GBuffer MRT (4x MSAA)
    {
      hdrColorAtt.view = hdrMsaaView;
      hdrColorAtt.resolveTarget = hdrResolveView;
      gbufColorAtt.view = gbufMsaaView;
      gbufColorAtt.resolveTarget = gbufResolveView;
      hdrDepthAtt.view = depthView;
      const p = enc.beginRenderPass(hdrPassDesc);
      p.setPipeline(skyPipe);
      p.setBindGroup(0, sceneOnlyBG);
      p.draw(3);
      p.setPipeline(worldPipe);
      p.setBindGroup(0, worldBG);
      p.setVertexBuffer(0, worldVB);
      p.setIndexBuffer(worldIB, 'uint32');
      p.drawIndexed(track.worldBuffers.indexCount);
      p.setPipeline(decalPipe);
      p.setBindGroup(0, worldBG);
      p.setVertexBuffer(0, decalVB);
      p.setIndexBuffer(decalIB, 'uint32');
      p.drawIndexed(track.decalBuffers.indexCount);
      p.setPipeline(shadowPipe);
      p.setBindGroup(0, sceneOnlyBG);
      for (let i = 0; i < NUM_CARS; i++) {
        const vm = vehicleGpu[colMap[i]];
        p.setVertexBuffer(0, vm.shadowVB);
        p.setIndexBuffer(vm.shadowIB, 'uint16');
        p.setBindGroup(1, carDynBG, [(20 + i) * 256]);
        p.drawIndexed(vm.shadowCount);
      }
      p.setPipeline(carPipe);
      p.setBindGroup(0, carSceneBG);
      for (let i = 0; i < NUM_CARS; i++) {
        const vm = vehicleGpu[colMap[i]];
        p.setVertexBuffer(0, vm.bodyVB);
        p.setIndexBuffer(vm.bodyIB, 'uint32');
        p.setBindGroup(1, carDynBG, [i * 256]);
        p.drawIndexed(vm.bodyCount);
        p.setVertexBuffer(0, vm.wheelVB);
        p.setIndexBuffer(vm.wheelIB, 'uint32');
        for (let w = 0; w < 4; w++) {
          p.setBindGroup(1, carDynBG, [(4 + i * 4 + w) * 256]);
          p.drawIndexed(vm.wheelCount);
        }
      }
      if (particleQuadCount > 0) {
        p.setPipeline(particlePipe);
        p.setBindGroup(0, sceneOnlyBG);
        p.setVertexBuffer(0, particleVB);
        p.setIndexBuffer(particleIB, 'uint16');
        p.drawIndexed(particleQuadCount * 6);
      }
      p.end();
    }
    // Passes 3, 4, 5: Bloom
    {
      bloomAAtt.view = bloomAView;
      const bp = enc.beginRenderPass(bloomPrePassDesc);
      bp.setPipeline(bloomPrePipe);
      bp.setBindGroup(0, bloomPreBG);
      bp.draw(3);
      bp.end();
      bloomBAtt.view = bloomBView;
      const bh = enc.beginRenderPass(bloomBlurHPassDesc);
      bh.setPipeline(bloomBlurPipe);
      bh.setBindGroup(0, bloomBlurHBG);
      bh.draw(3);
      bh.end();
      const bv = enc.beginRenderPass(bloomBlurVPassDesc);
      bv.setPipeline(bloomBlurPipe);
      bv.setBindGroup(0, bloomBlurVBG);
      bv.draw(3);
      bv.end();
    }
    // Pass 6: Composite + HUD
    {
      swapAtt.view = context.getCurrentTexture().createView();
      const fp = enc.beginRenderPass(finalPassDesc);
      fp.setPipeline(compositePipe);
      fp.setBindGroup(0, compositeBG);
      fp.draw(3);
      if (hudQuadCount > 0) {
        fp.setPipeline(hudPipe);
        fp.setBindGroup(0, hudBG);
        fp.setVertexBuffer(0, hudVB);
        fp.setIndexBuffer(hudIB, 'uint16');
        fp.drawIndexed(hudQuadCount * 6);
      }
      fp.end();
    }

    let slotToMap = -1;
    if (hasTimestamp) {
      enc.resolveQuerySet(querySet, 0, 2, queryResolveBuf, 0);
      if (queryBusy[ringCursor] === 0) {
        slotToMap = ringCursor;
        enc.copyBufferToBuffer(queryResolveBuf, 0, queryReadBufs[slotToMap], 0, 16);
        queryBusy[slotToMap] = 1;
        ringCursor = (ringCursor + 1) % RING_N;
      }
    }
    device.queue.submit([enc.finish()]);
    if (slotToMap >= 0) {
      queryReadBufs[slotToMap].mapAsync(GPUMapMode.READ).then(ringCallbacks[slotToMap]);
    }
  }

  let lastMs = performance.now();
  let accum = 0;
  let paused = false;
  if (location.search.indexOf('autopilot=1') >= 0) {
    sim.state.autopilot = true;
    launchFromMenu(true);
  }
  function loop(nowMs) {
    const dtMs = nowMs - lastMs;
    lastMs = nowMs;
    if (dtMs > 0 && dtMs < 250 && frameTimeCount < MAX_TELEM) {
      frameTimesMs[frameTimeCount++] = dtMs;
    }
    if (!paused) {
      const clampedDt = dtMs > 50 ? 0.05 : (dtMs < 0 ? 0 : dtMs * 0.001);
      accum += clampedDt;
      while (accum >= FIXED_DT) {
        sim.step(FIXED_DT);
        accum -= FIXED_DT;
      }
      const p = sim.cars[0];
      audio.update(p.rpm, p.throttle, p.skidAmt, sim.state.phase === 1, sim.state.carColorIdx[0]);
      if (sim.state.bumpStrength > 0.05) audio.triggerBump(sim.state.bumpStrength);
    }
    renderFrame(nowMs);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  window.__fuscaDebug = {
    hasTimestamp,
    showMenu() { openMenu(); },
    hideMenu() { if (menuEl) menuEl.style.display = 'none'; },
    selectCar(idx) { syncCarSelectionUI(idx); },
    selectTrack(idx) { syncTrackSelectionUI(idx); },
    setAutopilot(v) { sim.state.autopilot = !!v; },
    setPaused(v) { paused = !!v; },
    setHudVisible(v) { hudVisible = !!v; },
    resetRace(skipCountdown = false) {
      if (menuEl) menuEl.style.display = 'none';
      sim.resetRace(!!skipCountdown);
    },
    setCameraOverride(ex, ey, ez, tx, ty, tz, fovDeg = 54) {
      camOverride.active = true;
      camOverride.ex = ex; camOverride.ey = ey; camOverride.ez = ez;
      camOverride.tx = tx; camOverride.ty = ty; camOverride.tz = tz;
      camOverride.fov = fovDeg * Math.PI / 180;
    },
    clearCameraOverride() { camOverride.active = false; },
    stepSim(seconds) {
      const steps = Math.round(seconds / FIXED_DT);
      for (let i = 0; i < steps; i++) sim.step(FIXED_DT);
    },
    renderOnce() { renderFrame(performance.now()); },
    getModelStats() {
      return vehicleMeshes.map((vm, idx) => ({
        model: CAR_SPECS[idx].model,
        bodyTris: vm.body.indexCount / 3,
        wheelTris: vm.wheel.indexCount / 3
      }));
    },
    getTrackSample(stationIdx) {
      const s = ((stationIdx % track.N) + track.N) % track.N;
      return {
        px: track.posX[s], py: track.posY[s], pz: track.posZ[s],
        tx: track.tanX[s], ty: track.tanY[s], tz: track.tanZ[s],
        lx: track.leftX[s], ly: track.leftY[s], lz: track.leftZ[s],
        nx: track.normX[s], ny: track.normY[s], nz: track.normZ[s]
      };
    },
    getState() {
      return {
        width, height,
        phase: sim.state.phase,
        raceTime: sim.state.raceTime,
        winnerIdx: sim.state.winnerIdx,
        order: Array.from(sim.state.order),
        carColorIdx: Array.from(sim.state.carColorIdx),
        cars: sim.cars.map(c => ({
          id: c.id, x: c.x, y: c.y, z: c.z, yaw: c.yaw,
          speed: c.speed, lap: c.lap, rank: c.rank,
          station: c.station, finished: c.finished, finishTime: c.finishTime
        }))
      };
    },
    resetTelemetry() { gpuTimeCount = 0; frameTimeCount = 0; },
    getTelemetry() {
      const calc = (arr, n) => {
        if (n === 0) return { count: 0, mean: 0, p99: 0, max: 0, over11: 0 };
        const s = Array.from(arr.subarray(0, n)).sort((a, b) => a - b);
        let sum = 0, over11 = 0;
        for (let i = 0; i < n; i++) { sum += s[i]; if (s[i] > 11.0) over11++; }
        return {
          count: n,
          mean: +(sum / n).toFixed(4),
          p95: +s[Math.min(n - 1, Math.floor(n * 0.95))].toFixed(4),
          p99: +s[Math.min(n - 1, Math.floor(n * 0.99))].toFixed(4),
          max: +s[n - 1].toFixed(4),
          over11
        };
      };
      return {
        hasTimestamp,
        resolution: `${width}x${height}`,
        gpuMs: calc(gpuTimesMs, gpuTimeCount),
        frameMs: calc(frameTimesMs, frameTimeCount)
      };
    }
  };
}
start();

})();
</script></body></html>
